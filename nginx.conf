# Static file server for the portfolio. Pretty URLs, gzip, security headers.
# TLS is expected to be terminated by the Kubernetes ingress, so no HSTS here
# (add it at the ingress, or uncomment below if this serves TLS directly).

server {
    listen        5000;
    server_name   _;
    root          /usr/share/nginx/html;
    index         index.html;

    # Kubernetes liveness/readiness probe target.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    gzip            on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types      text/css application/javascript text/markdown image/svg+xml application/json text/plain;

    # Security headers. CSP is strict: the site loads no third-party resources.
    # 'unsafe-inline' covers the small inline scripts (theme toggle, footer year,
    # CV loader, JSON-LD) and inline style attributes.
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options          "DENY" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # HSTS (enable only if nginx terminates TLS itself):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Pretty URLs: /impressum -> impressum.html, /index.de -> index.de.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Long-cache fingerprint-free static assets. `expires` does not reset the
    # inherited security headers (unlike add_header in a location block).
    location ~* \.(css|js|svg|woff2|png|jpe?g|ico)$ {
        expires 30d;
    }
}
